dat:
  kind: doubler
  base: null
  do: sprint25.run_it
  args: null
  kwargs: null
  path: sprint25
  __doc__: "Each toplevel multi-stage pipeline will have a configuration file like\
    \ this one.\n\nThis (inane) multi-state pipeline has three stages:\n- the preprocessing\
    \ stage creates two outputs: gallery.txt and results.txt file\n- the doubler stage\
    \ doubles the results.txt file from the gallery for no good reason\n- the final\
    \ stage combines the gallery.txt and the doubler results doubled again\n\nThis\
    \ multi-stage pipe is designed as a regression suite where we \nkeep each run\
    \ in a separate dated folder under the \"doubler\" subfolder\nso when we have\
    \ auto caching these runs will be cached into dated sub-folder\nso we can run\
    \ reports that graph performance over weeks and months.\n"
  target_exists: overwrite
common:
  dat:
    kind: Mcproc
    base: hello_std_args
    do: hello_mspipe.fake_mcproc_runner
  debug_level: 3
  debug: 11
stages:
  preprocessing:
    kind: gallery_stage
    debug_level: 1
    outputs:
      gallery.txt:
      - '>>This is not really a gallery.'
      - '>>It''s just a file called gallery!'
      results.txt:
      - '>>Stage 1: Results.txt line1'
      - '>>Stage 1: Results.txt line2'
  doubler:
    kind: doubler_stage
    outputs:
      double_trouble.txt:
      - '>>If results are good, then more results are better!'
      - <<../preprocessing/results.txt
      - <<../preprocessing/results.txt
  final_stage:
    kind: final_stage
    outputs:
      final_results.txt:
      - '>>The Final results are in!  Gallery first:'
      - <<../preprocessing/gallery.txt
      - '>>And now the results.  Doubled once more, just to be sure!'
      - <<../doubler/double_trouble.txt
      - <<../doubler/double_trouble.txt
