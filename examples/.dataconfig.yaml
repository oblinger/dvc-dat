# DVC-Dat Examples Configuration

# Local folder where example Dats are stored
local_prefix: example_sync_folder/

# Remote storage prefix
remote_prefix: example-data/

# Default remote protocol
default_remote: gs

# Additional local folders to search for Dats
extra_local_prefixes: []

# Dat class mappings
dat:
  mappings: {}

# Mount commands for the "do" system
mount_commands:
  - at: ""
    folder: ../standard_do_scripts
  - at: ""
    folder: example_mounted_folder
  - at: ""
    folder: example_mounted_folder/dat_tools_examples
  - at: ""
    folder: example_mounted_folder/script
  - at: foo
    file: example_mounted_folder/some_python_file.py
  - at: bar
    file: example_mounted_folder/some_other_python_file.py
  - at: baz
    file: example_mounted_folder/script/my_yaml_data.yaml
  - at: the_dat_module
    module: dvc_dat
  - at: foo.bar.baz
    value: [11, 22, 33]
