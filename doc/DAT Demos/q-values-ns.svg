<text x="786" y="84" font-size="12" fill="#333">Two versions in one repo. <tspan font-family="Menlo, monospace" fill="#000">geometry.py</tspan>, the root</text>
<text x="786" y="101" font-size="12" fill="#333">of the source tree, carries the whole project's</text>
<text x="786" y="118" font-size="12" fill="#333">version, 5.3.9: on the ledger it is the row</text>
<text x="786" y="135" font-size="12" fill="#333"><tspan font-family="Menlo, monospace" fill="#000">db/repo/geometry/geometry  db/version</tspan>.</text>
<text x="786" y="152" font-size="12" fill="#333"><tspan font-family="Menlo, monospace" fill="#000">plane/__init__.py</tspan> versions the package <tspan font-family="Menlo, monospace" fill="#000">plane</tspan></text>
<text x="786" y="169" font-size="12" fill="#333">alone, 2.7.1: the row <tspan font-family="Menlo, monospace" fill="#000">db/repo/geometry/plane</tspan>.</text>
<path d="M786,118 L768,134" fill="none" stroke="#777" stroke-width="1.2" marker-end="url(#head)"/>
<text x="786" y="330" font-size="12" fill="#333">The ledger versions itself too: the subject <tspan font-family="Menlo, monospace" fill="#000">db</tspan></text>
<text x="786" y="347" font-size="12" fill="#333">carries <tspan font-family="Menlo, monospace" fill="#000">db/version</tspan>, bumped on a release.</text>
<text x="786" y="364" font-size="12" fill="#333">0.1.0 was added at rev 9, so <tspan font-family="Menlo, monospace" fill="#000">L.at("0.1.0")</tspan> is</text>
<text x="786" y="381" font-size="12" fill="#333">rev 9, and <tspan font-family="Menlo, monospace" fill="#000">L.at("0.1.0").ns</tspan> loads <tspan font-family="Menlo, monospace" fill="#000">plane</tspan> 2.7.2.</text>
