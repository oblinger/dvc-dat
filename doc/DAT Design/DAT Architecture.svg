<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <!-- Callers band -->
  <rect x="30" y="18" width="1140" height="44" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="600" y="46" text-anchor="middle" fill="#1a1a1a" font-size="15">Callers — SVP (sv-pipe) · notebooks · examples/walkthrough.ipynb · a shell</text>
  <line x1="215" y1="62" x2="215" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="86" fill="#444" font-size="12">Dat.create / Dat.load</text>
  <line x1="600" y1="62" x2="600" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="607" y="86" fill="#444" font-size="12">do(…) / do.load / do.mount</text>
  <line x1="985" y1="62" x2="985" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="992" y="86" fill="#444" font-size="12">dat TARGET …</text>

  <!-- Column A: Dat storage -->
  <rect x="30" y="100" width="370" height="500" rx="8" fill="#e8f0fe" stroke="#5b7fbf"/>
  <text x="215" y="124" text-anchor="middle" fill="#1a3a7a" font-size="16" font-weight="bold">Dat storage · core.py</text>

  <rect x="50" y="140" width="330" height="66" rx="4" fill="#fff" stroke="#333"/>
  <text x="215" y="160" text-anchor="middle" fill="#1a1a1a" font-weight="bold">load_dat_config  ←  .datconfig.yaml</text>
  <text x="215" y="180" text-anchor="middle" fill="#333" font-size="12">dat_folders · art_folder · run   (unknown key = error)</text>
  <text x="215" y="197" text-anchor="middle" fill="#333" font-size="12">&lt; .override.yaml &lt; DAT_FOLDERS · DAT_ART_FOLDER</text>

  <rect x="50" y="226" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="215" y="246" text-anchor="middle" fill="#1a1a1a" font-weight="bold">DatManager  (Dat.manager = the default)</text>
  <text x="215" y="266" text-anchor="middle" fill="#333" font-size="12">create · load · exists · execute · save</text>
  <text x="215" y="283" text-anchor="middle" fill="#333" font-size="12">recording · the index · weak cache</text>

  <rect x="50" y="312" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="215" y="332" text-anchor="middle" fill="#1a1a1a" font-weight="bold">expand · expand_spec · merge_dicts</text>
  <text x="215" y="352" text-anchor="middle" fill="#333" font-size="12">{YYYY} … {now} {cwd} {unique} · {a.b} → do.load</text>
  <text x="215" y="369" text-anchor="middle" fill="#333" font-size="12">once, at create, with the folder's own now / unique</text>

  <rect x="50" y="398" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="215" y="418" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Dat   ·   DatContainer</text>
  <text x="215" y="438" text-anchor="middle" fill="#333" font-size="12">get_spec · get_results · save · copy · move · delete</text>
  <text x="215" y="455" text-anchor="middle" fill="#333" font-size="12">validate_spec · Dat.get / set · get_dats</text>

  <rect x="50" y="506" width="330" height="74" rx="4" fill="#fff" stroke="#333" stroke-dasharray="6 4"/>
  <text x="215" y="526" text-anchor="middle" fill="#1a1a1a" font-weight="bold">dat + artifact folders (filesystem)</text>
  <text x="215" y="548" text-anchor="middle" fill="#333" font-size="12">&lt;path&gt;/_spec_.yaml  — the record, never rewritten</text>
  <text x="215" y="566" text-anchor="middle" fill="#333" font-size="12">_result_.yaml (code · dependencies) · _art_.yaml</text>

  <line x1="215" y1="206" x2="215" y2="224" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="215" y1="290" x2="215" y2="310" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="304" fill="#444" font-size="11">create</text>
  <line x1="215" y1="376" x2="215" y2="396" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="390" fill="#444" font-size="11">write, then load as dat.kind</text>
  <line x1="215" y1="462" x2="215" y2="504" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="222" y="488" fill="#444" font-size="11">read spec · write result</text>

  <!-- Column B: Do-system -->
  <rect x="415" y="100" width="370" height="500" rx="8" fill="#e6f4ea" stroke="#5a9a6a"/>
  <text x="600" y="124" text-anchor="middle" fill="#1a5a2a" font-size="16" font-weight="bold">Do-system · do.py</text>

  <rect x="435" y="140" width="330" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="600" y="160" text-anchor="middle" fill="#1a1a1a" font-weight="bold">do → Dat.manager.do   (a Do per manager)</text>
  <text x="600" y="180" text-anchor="middle" fill="#333" font-size="12">__call__ · load · name_of · keys · mount</text>

  <rect x="435" y="210" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="600" y="230" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Dat.manager — on first use</text>
  <text x="600" y="250" text-anchor="middle" fill="#333" font-size="12">load_dat_config() · mounts dt, dt.list</text>
  <text x="600" y="267" text-anchor="middle" fill="#333" font-size="12">config folder first on sys.path</text>

  <rect x="435" y="294" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="600" y="314" text-anchor="middle" fill="#1a1a1a" font-weight="bold">__call__ — the fork rule</text>
  <text x="600" y="334" text-anchor="middle" fill="#333" font-size="12">args replace dat.args · kwargs into dat.kwargs</text>
  <text x="600" y="351" text-anchor="middle" fill="#333" font-size="12">_resolve_base (dat.base) · manager.execute</text>

  <rect x="435" y="378" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="600" y="398" text-anchor="middle" fill="#1a1a1a" font-weight="bold">load(dotted)</text>
  <text x="600" y="418" text-anchor="middle" fill="#333" font-size="12">1 · a mounted name</text>
  <text x="600" y="435" text-anchor="middle" fill="#333" font-size="12">2 · longest importable prefix, then getattr</text>

  <rect x="435" y="506" width="330" height="74" rx="4" fill="#fff" stroke="#333" stroke-dasharray="6 4"/>
  <text x="600" y="526" text-anchor="middle" fill="#1a1a1a" font-weight="bold">sources</text>
  <text x="600" y="548" text-anchor="middle" fill="#333" font-size="12">do.mount: folder · file · module · value</text>
  <text x="600" y="566" text-anchor="middle" fill="#333" font-size="12">the Python environment (sys.modules)</text>

  <line x1="600" y1="190" x2="600" y2="208" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="358" x2="600" y2="376" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="442" x2="600" y2="504" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="607" y="478" fill="#444" font-size="11">resolves in</text>

  <!-- Cross-column arrows A <-> B -->
  <line x1="433" y1="228" x2="382" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="386" y="215" fill="#444" font-size="11">reads</text>
  <line x1="433" y1="252" x2="382" y2="258" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="386" y="248" fill="#444" font-size="11">builds</text>
  <line x1="433" y1="330" x2="382" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="384" y="456" fill="#444" font-size="11">create · save</text>
  <line x1="382" y1="350" x2="433" y2="408" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="386" y="346" fill="#444" font-size="11">{a.b}</text>

  <!-- Column C: CLI and tools -->
  <rect x="800" y="100" width="370" height="500" rx="8" fill="#fef3e2" stroke="#c98a3a"/>
  <text x="985" y="124" text-anchor="middle" fill="#7a4a10" font-size="16" font-weight="bold">CLI and tools</text>

  <rect x="820" y="140" width="330" height="64" rx="4" fill="#fff" stroke="#333"/>
  <text x="985" y="160" text-anchor="middle" fill="#1a1a1a" font-weight="bold">bin/dat  (sh bootstrap)</text>
  <text x="985" y="180" text-anchor="middle" fill="#333" font-size="12">nearest .datconfig.yaml → exec $DAT_RUN | run: | .venv</text>
  <text x="985" y="197" text-anchor="middle" fill="#333" font-size="12">exports DAT_CLI_CONFIG · PYTHONPATH += config folder</text>

  <rect x="820" y="224" width="330" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="985" y="244" text-anchor="middle" fill="#1a1a1a" font-weight="bold">your main  (run:)</text>
  <text x="985" y="264" text-anchor="middle" fill="#333" font-size="12">do.mount(…) · sys.exit(dat.cli_main())</text>

  <rect x="820" y="294" width="330" height="50" rx="4" fill="#fff" stroke="#333"/>
  <text x="985" y="314" text-anchor="middle" fill="#1a1a1a" font-weight="bold">dat console script · python -m dvc_dat</text>
  <text x="985" y="334" text-anchor="middle" fill="#333" font-size="12">no run:, no project mounts</text>

  <rect x="820" y="364" width="330" height="86" rx="4" fill="#fff" stroke="#333"/>
  <text x="985" y="384" text-anchor="middle" fill="#1a1a1a" font-weight="bold">cli_main   (do.py)</text>
  <text x="985" y="404" text-anchor="middle" fill="#333" font-size="12">TARGET ARG… KEY=VALUE   (YAML scalars)</text>
  <text x="985" y="421" text-anchor="middle" fill="#333" font-size="12">--set · --json · --dry-run · --usage</text>
  <text x="985" y="438" text-anchor="middle" fill="#333" font-size="12">list · info · version · exit 0 / 1 / 2</text>

  <rect x="820" y="506" width="330" height="74" rx="4" fill="#fff" stroke="#333"/>
  <text x="985" y="526" text-anchor="middle" fill="#1a1a1a" font-weight="bold">dat_tools.py — mounted as dt</text>
  <text x="985" y="548" text-anchor="middle" fill="#333" font-size="12">Cube · from_dat · to_excel · dat_report · cmd_list</text>
  <text x="985" y="566" text-anchor="middle" fill="#333" font-size="12">pandas · xlsxwriter (excel extra)</text>

  <line x1="985" y1="204" x2="985" y2="222" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 1150 249 L 1162 249 L 1162 407 L 1152 407" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="985" y1="344" x2="985" y2="362" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="818" y1="400" x2="767" y2="332" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="770" y="398" fill="#444" font-size="11">do(…)</text>
  <line x1="818" y1="540" x2="767" y2="540" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="792" y="533" text-anchor="middle" fill="#444" font-size="11">dt</text>
  <text x="985" y="480" text-anchor="middle" fill="#333" font-size="12">Cube walks dats through Dat.load</text>
  <text x="985" y="496" text-anchor="middle" fill="#333" font-size="12">a point fn named by a string goes through do.load</text>
</svg>
