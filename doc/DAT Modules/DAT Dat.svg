<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="880" fill="#ffffff"/>

  <!-- the dat folder: a container for its files -->
  <rect x="40" y="300" width="720" height="360" rx="14" fill="#fafafa" stroke="#37474f" stroke-width="2"/>

  <!-- nodes -->
  <g stroke="#37474f" stroke-width="2">
    <rect x="40" y="60" width="320" height="150" rx="10" fill="#e3f2fd"/>
    <rect x="470" y="60" width="280" height="150" rx="10" fill="#e8f5e9"/>
    <rect x="860" y="60" width="300" height="150" rx="10" fill="#e3f2fd"/>
    <rect x="1300" y="60" width="260" height="150" rx="10" fill="#fff8e1"/>

    <rect x="70" y="380" width="320" height="110" rx="10" fill="#ffffff"/>
    <rect x="420" y="380" width="310" height="110" rx="10" fill="#ffffff"/>
    <rect x="70" y="515" width="320" height="110" rx="10" fill="#eceff1"/>
    <rect x="420" y="515" width="310" height="110" rx="10" fill="#ffffff"/>

    <rect x="860" y="300" width="300" height="110" rx="10" fill="#f3e5f5"/>
    <rect x="860" y="520" width="300" height="110" rx="10" fill="#fff3e0"/>
    <rect x="1300" y="520" width="260" height="110" rx="10" fill="#fff3e0"/>

    <rect x="40" y="740" width="320" height="110" rx="10" fill="#e3f2fd"/>
  </g>

  <g fill="#263238" text-anchor="middle">
    <text x="200" y="100" font-size="23" font-weight="bold">Dat</text>
    <text x="200" y="124" font-size="15" fill="#607d8b">class · a dat folder in memory</text>
    <text x="200" y="152" font-size="15">Dat.manager · Dat.do · load · create</text>
    <text x="200" y="174" font-size="15">get_spec · get_results · save · verify</text>

    <text x="610" y="100" font-size="23" font-weight="bold">Do</text>
    <text x="610" y="124" font-size="15" fill="#607d8b">class · manager.do, one per world</text>
    <text x="610" y="152" font-size="15">dotted name → object</text>
    <text x="610" y="174" font-size="15">mount · load · name_of</text>

    <text x="1010" y="100" font-size="23" font-weight="bold">DatManager</text>
    <text x="1010" y="124" font-size="15" fill="#607d8b">class · a world of dats</text>
    <text x="1010" y="152" font-size="15">create · load · run</text>
    <text x="1010" y="174" font-size="15">recording · save_artifact</text>
    <text x="1010" y="198" font-size="15" font-style="italic" fill="#2e7d32">governed by The manager is the world</text>

    <text x="1430" y="100" font-size="21" font-weight="bold">.datconfig.yaml</text>
    <text x="1430" y="124" font-size="15" fill="#607d8b">config file · found walking up</text>
    <text x="1430" y="152" font-size="15">dat_folders · art_folder</text>
    <text x="1430" y="174" font-size="15">index · verify · manager · run</text>

    <text x="400" y="332" font-size="21" font-weight="bold">dat folder</text>
    <text x="400" y="354" font-size="15" fill="#607d8b">folder · data/runs/2026-10/exp1/</text>

    <text x="230" y="418" font-size="19" font-weight="bold">_spec_.yaml</text>
    <text x="230" y="440" font-size="15" fill="#607d8b">file · the recipe</text>
    <text x="230" y="464" font-size="15">dat.kind · do · args · kwargs</text>

    <text x="575" y="418" font-size="19" font-weight="bold">_result_.yaml</text>
    <text x="575" y="440" font-size="15" fill="#607d8b">file · written by save()</text>
    <text x="575" y="464" font-size="15">sha256 · standing · dependencies</text>

    <text x="230" y="553" font-size="19" font-weight="bold">run/</text>
    <text x="230" y="575" font-size="15" fill="#607d8b">sub-dat · not content</text>
    <text x="230" y="599" font-size="15">run_at · host · code · work/</text>

    <text x="575" y="553" font-size="19" font-weight="bold">model.pt …</text>
    <text x="575" y="575" font-size="15" fill="#607d8b">files · what the run wrote</text>
    <text x="575" y="599" font-size="15">content, under the hash</text>

    <text x="1010" y="340" font-size="21" font-weight="bold">fn</text>
    <text x="1010" y="362" font-size="15" fill="#607d8b">function · the one dat.do names</text>
    <text x="1010" y="388" font-size="15">fn(dat, *args, **kwargs)</text>

    <text x="1010" y="560" font-size="21" font-weight="bold">art/</text>
    <text x="1010" y="582" font-size="15" fill="#607d8b">artifact store · write-once</text>
    <text x="1010" y="608" font-size="15">&lt;name&gt;/payload + _art_.yaml</text>

    <text x="1430" y="560" font-size="21" font-weight="bold">_index_.json</text>
    <text x="1430" y="582" font-size="15" fill="#607d8b">index file · one namespace</text>
    <text x="1430" y="608" font-size="15">names, sha256: URNs</text>

    <text x="200" y="780" font-size="23" font-weight="bold">DatContainer</text>
    <text x="200" y="804" font-size="15" fill="#607d8b">class · a Dat subclass</text>
    <text x="200" y="830" font-size="15">get_dat_paths · get_dats</text>
  </g>

  <!-- topic annotations -->
  <g font-size="15" font-style="italic" fill="#2e7d32" text-anchor="middle">
    <text x="610" y="232">governed by The spec is the record</text>
    <text x="1430" y="232">governed by Configuration</text>
    <text x="400" y="648">governed by Sealing and the content hash</text>
    <text x="1010" y="654">governed by Artifacts and the index</text>
  </g>
  <g font-size="15" font-style="italic" fill="#2e7d32">
    <text x="1022" y="436">governed by Dependency capture</text>
    <text x="745" y="507" text-anchor="end">governed by Standing</text>
  </g>

  <!-- primary flow: solid -->
  <g stroke="#37474f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="360" y1="135" x2="466" y2="135"/>
    <line x1="750" y1="135" x2="856" y2="135"/>
    <line x1="1300" y1="135" x2="1164" y2="135"/>
    <line x1="880" y1="210" x2="712" y2="298"/>
    <line x1="1010" y1="210" x2="1010" y2="296"/>
    <line x1="860" y1="380" x2="734" y2="425"/>
    <line x1="1010" y1="410" x2="1010" y2="516"/>
  </g>

  <!-- secondary: dotted -->
  <g stroke="#78909c" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)">
    <path d="M1010,60 C1010,6 200,6 200,56"/>
    <line x1="200" y1="300" x2="200" y2="214"/>
    <line x1="1160" y1="575" x2="1296" y2="575"/>
    <line x1="1380" y1="520" x2="1150" y2="214"/>
    <line x1="200" y1="740" x2="200" y2="664"/>
  </g>

  <!-- edge labels -->
  <g font-size="16" fill="#37474f">
    <text x="415" y="124" text-anchor="middle">Dat.do</text>
    <text x="805" y="124" text-anchor="middle">names</text>
    <text x="1232" y="124" text-anchor="middle" font-size="15">load_dat_config()</text>
    <text x="770" y="264" text-anchor="end">create(): _spec_.yaml</text>
    <text x="1022" y="282">calls, cwd run/work/</text>
    <text x="800" y="380" text-anchor="middle">save()</text>
    <text x="1022" y="470">save_artifact()</text>
    <text x="605" y="44" text-anchor="middle">Dat.manager: the default world</text>
    <text x="212" y="262">load() returns</text>
    <text x="1228" y="563" text-anchor="middle">keyed in</text>
    <text x="1306" y="400">load("sha256:…")</text>
    <text x="212" y="706">get_dats(): child dats</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#37474f">
    <line x1="860" y1="790" x2="920" y2="790" stroke="#37474f" stroke-width="2.5"/>
    <text x="932" y="795">primary flow: the call that does it</text>
    <line x1="860" y1="826" x2="920" y2="826" stroke="#78909c" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="932" y="831">returns, refers to, contains</text>
  </g>
</svg>
