[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dvc_dat"
dependencies = [
    "pandas",
    "pyyaml",
]
requires-python = ">=3.11"
keywords = ["dvc"]
readme = "README.md"
dynamic = ["version"]

[project.optional-dependencies]
excel = ["xlsxwriter"]
pg = ["psycopg[binary]>=3.1"]

[tool.setuptools]
packages = ["dvc_dat", "dvc_dat.ledger"]

[tool.setuptools.package-data]
dvc_dat = ["dvc_dat.just"]

[tool.setuptools.dynamic]
version = {attr = "dvc_dat.__init__.__version__"}

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ipykernel>=6.29.5",
    "jupytext>=1.17.1",
    "nbconvert>=7.16.6",
    "psycopg[binary]>=3.1",
    "pyarrow>=15",
    "pytest>=8.3.5",
    "xlsxwriter>=3.2.9",
]
