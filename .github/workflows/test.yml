name: test

on:
  push:
    branches: [main]
  pull_request:
    # A doc-only PR skips the suite; push to main runs it always.  The docs the
    # suite executes are listed back in: a new one goes here too.
    paths:
      - '**'
      - '!doc/**'
      - '!**/*.md'
      - 'doc/DAT Demos/**'           # test_demo_notebooks, test_examples, ledger/test_notebooks
      - 'doc/concepts.md'            # test_v2 runs their python recipes
      - 'doc/spec-format.md'

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: extractions/setup-just@v2     # `just run`, `x` and the ledger-just notebook
      - uses: ./.github/actions/ffmpeg   # Video (SVP 249)
      - run: uv sync --locked
      - run: uv run python -m pytest -q -n auto --dist loadgroup

  # One process, in collection order: a test that leaves process-wide state behind (the default
  # `Dat.manager`, the working directory, an environment variable) breaks a later one only here; the
  # parallel run above spreads them across workers and hides it (SVP 1546).
  sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: ./.github/actions/ffmpeg   # Video (SVP 249)
      - run: uv sync --locked
      - run: uv run python -m pytest -q -p no:xdist

  # The `pg` cases skip without DVC_DAT_TEST_PG (no default address); here the whole suite runs with
  # them against Postgres 16 (tests/pg_server.py reads it; port 5433 is refused there, SVP 1548).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dvcdat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DVC_DAT_TEST_PG: postgresql://postgres:dvcdat@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: ./.github/actions/ffmpeg   # Video (SVP 249)
      - run: uv sync --locked
      - run: uv run python -m pytest -q -n auto --dist loadgroup
