name: test

on:
  push:
    branches: [main]
  pull_request:
    # A doc-only PR skips the suite; push to main runs it always.  The docs the
    # suite executes are listed back in: a new one goes here too.
    paths:
      - '**'
      - '!doc/**'
      - '!**/*.md'
      - 'doc/DAT Demos/**'           # test_demo_notebooks, test_examples, ledger/test_notebooks
      - 'doc/concepts.md'            # test_v2 runs their python recipes
      - 'doc/spec-format.md'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: extractions/setup-just@v2     # `just run`, `x` and the ledger-just notebook
      - run: uv sync --locked
      - run: timeout 200 uv run python -m pytest -v -s -p no:xdist -o faulthandler_timeout=45 tests/ledger/test_value_encoding.py || true
      - run: timeout 200 uv run python -m pytest -q -n 4 --dist loadgroup -o faulthandler_timeout=45 tests/ledger/test_value_encoding.py tests/ledger/test_stream_values.py || true
