# Build the documentation site on every push to main and deploy it to GitHub Pages:
# https://oblinger.github.io/dvc-dat/ (246 Q2). One site tracking main, not versioned by release (246 A5).
# The repository's Pages source is GitHub Actions. Notebooks are rendered with the outputs they were
# committed with, never executed here (246 A3).

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # a push waits: a busy main must not cancel every build before it deploys

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      # nbconvert's, for the notebooks; the release the site is built with locally, since the runner's apt
      # pandoc hung on them
      - run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc.deb
          rm pandoc.deb
          pandoc --version | head -1
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict
      - run: uv run --group docs python -m pytest -q tests/test_docs_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
